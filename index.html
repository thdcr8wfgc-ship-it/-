<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --accent2: #a78bfa;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', 'Hiragino Sans', sans-serif;
    background: linear-gradient(135deg, var(--bg), #1e1b4b);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: bold;
    color: var(--bg);
    box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
    transition: transform 0.3s ease;
  }
  .avatar:hover {
    transform: scale(1.08) rotate(5deg);
  }
  h1 {
    font-size: 2.2rem;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    color: var(--muted);
    margin-top: 8px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 30px;
    max-width: 600px;
    width: 100%;
    margin-bottom: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.05);
  }
  .card h2 {
    color: var(--accent);
    margin-bottom: 12px;
    font-size: 1.2rem;
  }
  .card p {
    color: var(--muted);
    line-height: 1.7;
  }
  .skills {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
  }
  .skill-tag {
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    border: 1px solid rgba(56, 189, 248, 0.3);
  }
  #clock {
    font-size: 1.4rem;
    color: var(--accent2);
    letter-spacing: 2px;
    margin-top: 8px;
  }
  button {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: var(--bg);
    border: none;
    padding: 12px 24px;
    border-radius: 999px;
    font-weight: bold;
    cursor: pointer;
    font-size: 1rem;
    transition: transform 0.2s ease;
  }
  button:hover { transform: scale(1.05); }
  #message {
    margin-top: 14px;
    color: var(--accent);
    min-height: 24px;
    font-weight: bold;
  }
  footer {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 20px;
  }
</style>
</head>
<body>

  <header>
    <div class="avatar">👤</div>
    <h1>あなたの名前</h1>
    <p class="subtitle">大学生 / Webページ制作課題</p>
  </header>

  <div class="card">
    <h2>自己紹介</h2>
    <p>はじめまして！このページはHTML・CSS・JavaScriptを使って自作したWebページです。デザインとちょっとしたインタラクション（時計・ボタン）を実装しました。</p>
  </div>

  <div class="card">
    <h2>好きなこと・興味</h2>
    <div class="skills">
      <span class="skill-tag">プログラミング</span>
      <span class="skill-tag">デザイン</span>
      <span class="skill-tag">音楽</span>
      <span class="skill-tag">映画</span>
    </div>
  </div>

  <div class="card" style="text-align:center;">
    <h2>現在時刻</h2>
    <div id="clock">--:--:--</div>
  </div>

  <div class="card" style="text-align:center;">
    <h2>クリックしてみて</h2>
    <button onclick="cheerUp()">応援メッセージをもらう</button>
    <div id="message"></div>
  </div>

  <footer>Made with HTML / CSS / JavaScript</footer>

  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const messages = [
      "今日もいい調子！",
      "その調子でがんばろう！",
      "小さな一歩が大きな成果に繋がる！",
      "休憩も大事だよ〜",
      "君ならできる！"
    ];
    function cheerUp() {
      const msg = messages[Math.floor(Math.random() * messages.length)];
      document.getElementById('message').textContent = msg;
    }
  </script>

</body>
</html>
